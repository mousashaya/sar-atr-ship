<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSTAR Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    .app-header { background: #1a1d27; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2d3a; flex-shrink: 0; }
    .app-title { font-size: 1.1rem; font-weight: 600; color: #7eb8f7; }
    .header-nav { display: flex; gap: 8px; }
    .nav-btn { padding: 6px 14px; border-radius: 6px; text-decoration: none; color: #aaa; font-size: 0.85rem; border: 1px solid #2a2d3a; }
    .nav-btn:hover { background: #2a2d3a; color: #fff; }
    .nav-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .app-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 220px; background: #13161f; padding: 16px; overflow-y: auto; border-right: 1px solid #2a2d3a; flex-shrink: 0; }
    .sidebar label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; margin-top: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .sidebar select { width: 100%; background: #1a1d27; color: #e0e0e0; border: 1px solid #2a2d3a; border-radius: 6px; padding: 6px 8px; font-size: 0.85rem; }
    .sidebar .count { font-size: 0.75rem; color: #666; margin-top: 8px; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { padding: 10px 16px; background: #13161f; border-bottom: 1px solid #2a2d3a; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .toolbar button { padding: 5px 12px; border-radius: 5px; border: 1px solid #2a2d3a; background: #1a1d27; color: #ccc; font-size: 0.8rem; cursor: pointer; }
    .toolbar button:hover { background: #2a2d3a; }
    .grid-area { flex: 1; overflow-y: auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .chip { background: #1a1d27; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
    .chip:hover { border-color: #2563eb; }
    .chip.selected { border-color: #f59e0b; }
    .chip img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; image-rendering: pixelated; }
    .chip-label { padding: 5px 7px; font-size: 0.7rem; color: #bbb; line-height: 1.3; }
    .chip-label strong { color: #e0e0e0; display: block; }
    .chip-label .az { color: #7eb8f7; font-size: 0.67rem; }
    .detail-panel { width: 340px; background: #13161f; border-left: 1px solid #2a2d3a; padding: 16px; overflow-y: auto; flex-shrink: 0; display: none; }
    .detail-panel.open { display: block; }
    .detail-panel img { width: 100%; border-radius: 6px; margin-bottom: 12px; image-rendering: pixelated; background: #000; }
    .detail-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1a1d27; font-size: 0.8rem; }
    .detail-row .lbl { color: #888; flex-shrink: 0; margin-right: 8px; }
    .detail-row .val { color: #e0e0e0; text-align: right; }
    .detail-section { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 4px; }
    .target-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; background: #1e3a5f; color: #7eb8f7; margin-bottom: 10px; }
    .split-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; margin-left: 6px; }
    .TRAIN { background: #1e4d2e; color: #6ee7b7; }
    .TEST  { background: #4a1e1e; color: #f87171; }
    .MIXED { background: #2d2d1e; color: #fbbf24; }
    .loading { text-align: center; color: #555; padding: 40px; }
    .empty { text-align: center; color: #444; padding: 60px 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header class="app-header">
    <span class="app-title">MSTAR Viewer — SAR Vehicle Chips</span>
    <div class="header-nav">
      <a class="nav-btn" href="/">ATRNet</a>
      <a class="nav-btn" href="/ships">ShipRS</a>
      <a class="nav-btn" href="/opensar">OpenSAR</a>
      <a class="nav-btn" href="/hrsid">HRSID</a>
      <a class="nav-btn active" href="/mstar">MSTAR</a>
      <a class="nav-btn" href="/sar-ships">SAR Re-ID</a>
      <a class="nav-btn" href="/experiments">Experiments</a>
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar">
      <div>
        <label>Target Type</label>
        <select id="f-target" onchange="loadImages()">
          <option value="">All targets</option>
          {% for t in targets %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Depression Angle</label>
        <select id="f-depression" onchange="loadImages()">
          <option value="">All angles</option>
          {% for d in depressions %}<option value="{{ d }}">{{ d }}°</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Split</label>
        <select id="f-split" onchange="loadImages()">
          <option value="">All</option>
          {% for s in splits %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="count" id="count-label">Loading...</div>
    </div>

    <div class="main">
      <div class="toolbar">
        <button onclick="loadMore()">Load more</button>
        <span id="toolbar-info" style="font-size:0.8rem;color:#555;"></span>
      </div>
      <div class="grid-area">
        <div class="grid" id="grid"></div>
        <div class="loading" id="loading" style="display:none">Loading...</div>
        <div class="empty"  id="empty"   style="display:none">No images found</div>
      </div>
    </div>

    <div class="detail-panel" id="detail-panel">
      <img id="detail-img" src="" alt="">
      <div id="detail-badges"></div>
      <div class="detail-section">Target</div>
      <div class="detail-row"><span class="lbl">Type</span><span class="val" id="d-type"></span></div>
      <div class="detail-row"><span class="lbl">Serial</span><span class="val" id="d-serial"></span></div>
      <div class="detail-section">Geometry</div>
      <div class="detail-row"><span class="lbl">Azimuth</span><span class="val" id="d-az"></span></div>
      <div class="detail-row"><span class="lbl">Depression (desired)</span><span class="val" id="d-dep-des"></span></div>
      <div class="detail-row"><span class="lbl">Depression (measured)</span><span class="val" id="d-dep-meas"></span></div>
      <div class="detail-section">Sensor</div>
      <div class="detail-row"><span class="lbl">Polarization</span><span class="val" id="d-pol"></span></div>
      <div class="detail-row"><span class="lbl">Radar mode</span><span class="val" id="d-mode"></span></div>
      <div class="detail-row"><span class="lbl">Image size</span><span class="val" id="d-size"></span></div>
      <div class="detail-row"><span class="lbl">Collection date</span><span class="val" id="d-date"></span></div>
      <div class="detail-row"><span class="lbl">Split</span><span class="val" id="d-split"></span></div>
    </div>
  </div>

<script>
  let offset = 0;
  const LIMIT = 200;
  let total = 0;

  function filters() {
    return {
      target:     document.getElementById('f-target').value,
      depression: document.getElementById('f-depression').value,
      split:      document.getElementById('f-split').value,
    };
  }

  async function loadImages(reset=true) {
    if (reset) { offset = 0; document.getElementById('grid').innerHTML = ''; }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('empty').style.display   = 'none';

    const f = filters();
    const params = new URLSearchParams({ ...f, limit: LIMIT, offset });
    const res  = await fetch('/api/mstar/images?' + params);
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';
    total = data.total;
    document.getElementById('count-label').textContent = `${total.toLocaleString()} images`;
    document.getElementById('toolbar-info').textContent =
      `Showing ${offset + data.images.length} of ${total.toLocaleString()}`;

    if (data.images.length === 0 && reset) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    const grid = document.getElementById('grid');
    data.images.forEach(img => {
      const div = document.createElement('div');
      div.className = 'chip';
      div.dataset.id = img.id;
      const az = img.azimuth_angle != null ? Math.round(img.azimuth_angle) + '°' : '';
      div.innerHTML = `
        <img src="/mstar-image/${img.id}" loading="lazy" alt="${img.target_short}">
        <div class="chip-label">
          <strong>${img.target_short}</strong>
          <span class="az">${img.desired_depression}°dep  ${az}az</span>
        </div>`;
      div.onclick = () => showDetail(img.id, div);
      grid.appendChild(div);
    });
    offset += data.images.length;
  }

  function loadMore() { loadImages(false); }

  async function showDetail(id, el) {
    document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');

    const res = await fetch(`/api/mstar/image/${id}`);
    const d   = await res.json();
    document.getElementById('detail-panel').classList.add('open');

    document.getElementById('detail-img').src = `/mstar-image/${id}?t=${Date.now()}`;

    const split = d.split || '';
    document.getElementById('detail-badges').innerHTML =
      `<span class="target-badge">${d.target_short || '?'}</span>` +
      `<span class="split-badge ${split}">${split}</span>`;

    document.getElementById('d-type').textContent     = d.target_type || '—';
    document.getElementById('d-serial').textContent   = d.serial_number || '—';
    document.getElementById('d-az').textContent       = d.azimuth_angle ? Math.round(d.azimuth_angle*10)/10 + '°' : '—';
    document.getElementById('d-dep-des').textContent  = d.desired_depression ? d.desired_depression + '°' : '—';
    document.getElementById('d-dep-meas').textContent = d.depression_angle ? Math.round(d.depression_angle*100)/100 + '°' : '—';
    document.getElementById('d-pol').textContent      = d.polarization || '—';
    document.getElementById('d-mode').textContent     = d.radar_mode || '—';
    document.getElementById('d-size').textContent     = (d.n_cols && d.n_rows) ? `${d.n_cols}×${d.n_rows}` : '—';
    document.getElementById('d-date').textContent     = d.collection_date || '—';
    document.getElementById('d-split').textContent    = split || '—';
  }

  loadImages();
</script>
</body>
</html>
