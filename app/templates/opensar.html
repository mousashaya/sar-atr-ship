<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSARShip Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    .app-header { background: #1a1d27; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2d3a; flex-shrink: 0; }
    .app-title { font-size: 1.1rem; font-weight: 600; color: #7eb8f7; }
    .header-nav { display: flex; gap: 8px; }
    .nav-btn { padding: 6px 14px; border-radius: 6px; text-decoration: none; color: #aaa; font-size: 0.85rem; border: 1px solid #2a2d3a; }
    .nav-btn:hover { background: #2a2d3a; color: #fff; }
    .nav-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .app-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 220px; background: #13161f; padding: 16px; overflow-y: auto; border-right: 1px solid #2a2d3a; flex-shrink: 0; }
    .sidebar label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; margin-top: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .sidebar select { width: 100%; background: #1a1d27; color: #e0e0e0; border: 1px solid #2a2d3a; border-radius: 6px; padding: 6px 8px; font-size: 0.85rem; }
    .sidebar .count { font-size: 0.75rem; color: #666; margin-top: 8px; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { padding: 10px 16px; background: #13161f; border-bottom: 1px solid #2a2d3a; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .toolbar button { padding: 5px 12px; border-radius: 5px; border: 1px solid #2a2d3a; background: #1a1d27; color: #ccc; font-size: 0.8rem; cursor: pointer; }
    .toolbar button:hover { background: #2a2d3a; }
    .grid-area { flex: 1; overflow-y: auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .chip { background: #1a1d27; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
    .chip:hover { border-color: #2563eb; }
    .chip.selected { border-color: #f59e0b; }
    .chip img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #111; }
    .chip-label { padding: 6px 8px; font-size: 0.72rem; color: #bbb; line-height: 1.3; }
    .chip-label strong { color: #e0e0e0; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip-label .pol { font-size: 0.68rem; color: #7eb8f7; }
    .detail-panel { width: 360px; background: #13161f; border-left: 1px solid #2a2d3a; padding: 16px; overflow-y: auto; flex-shrink: 0; display: none; }
    .detail-panel.open { display: block; }
    .detail-panel img { width: 100%; border-radius: 8px; margin-bottom: 12px; image-rendering: pixelated; }
    .detail-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1a1d27; font-size: 0.8rem; }
    .detail-row .lbl { color: #888; flex-shrink: 0; margin-right: 8px; }
    .detail-row .val { color: #e0e0e0; text-align: right; word-break: break-word; }
    .detail-section { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 4px; }
    .type-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .Cargo     { background: #1e3a5f; color: #7eb8f7; }
    .Tanker    { background: #2d1e4a; color: #c084fc; }
    .Fishing   { background: #1e4d2e; color: #6ee7b7; }
    .Dredging  { background: #4a3a1e; color: #fbbf24; }
    .Passenger { background: #4a1e1e; color: #f87171; }
    .Tug       { background: #1e3a3a; color: #67e8f9; }
    .loading { text-align: center; color: #555; padding: 40px; }
    .empty { text-align: center; color: #444; padding: 60px 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header class="app-header">
    <span class="app-title">OpenSARShip Viewer — SAR Ship Chips</span>
    <div class="header-nav">
      <a class="nav-btn" href="/">ATRNet</a>
      <a class="nav-btn" href="/ships">ShipRS</a>
      <a class="nav-btn active" href="/opensar">OpenSAR</a>
      <a class="nav-btn" href="/hrsid">HRSID</a>
      <a class="nav-btn" href="/fusar">FUSAR</a>
      <a class="nav-btn" href="/mstar">MSTAR</a>
      <a class="nav-btn" href="/sar-ships">SAR Re-ID</a>
      <a class="nav-btn" href="/experiments">Experiments</a>
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar">
      <div>
        <label>Ship Type</label>
        <select id="f-type" onchange="loadImages()">
          <option value="">All types</option>
          {% for t in ship_type %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Polarization</label>
        <select id="f-pol" onchange="loadImages()">
          <option value="">All</option>
          {% for p in polarization %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
        </select>
      </div>
      <div class="count" id="count-label">Loading...</div>
    </div>

    <div class="main">
      <div class="toolbar">
        <button onclick="loadMore()">Load more</button>
        <div style="display:flex;gap:4px;margin-left:8px;">
          <button id="btn-raw"   onclick="setMode('raw')"   style="padding:5px 12px;border-radius:5px;border:1px solid #2563eb;background:#2563eb;color:#fff;font-size:0.8rem;cursor:pointer;">Raw</button>
          <button id="btn-clean" onclick="setMode('clean')" style="padding:5px 12px;border-radius:5px;border:1px solid #2a2d3a;background:#1a1d27;color:#ccc;font-size:0.8rem;cursor:pointer;">Speckle-cleaned</button>
        </div>
        <span id="toolbar-info" style="font-size:0.8rem;color:#555;margin-left:8px;"></span>
      </div>
      <div class="grid-area">
        <div class="grid" id="grid"></div>
        <div class="loading" id="loading" style="display:none">Loading...</div>
        <div class="empty" id="empty" style="display:none">No images found</div>
      </div>
    </div>

    <div class="detail-panel" id="detail-panel">
      <img id="detail-img" src="" alt="">
      <div id="detail-type-badge" style="margin-bottom:10px;"></div>
      <div class="detail-section">AIS Data</div>
      <div class="detail-row"><span class="lbl">Ship type</span><span class="val" id="d-type"></span></div>
      <div class="detail-row"><span class="lbl">AIS type (raw)</span><span class="val" id="d-ais"></span></div>
      <div class="detail-row"><span class="lbl">Length</span><span class="val" id="d-length"></span></div>
      <div class="detail-row"><span class="lbl">Width</span><span class="val" id="d-width"></span></div>
      <div class="detail-section">SAR Metadata</div>
      <div class="detail-row"><span class="lbl">Polarization</span><span class="val" id="d-pol"></span></div>
      <div class="detail-row"><span class="lbl">Scene ID</span><span class="val" id="d-scene" style="font-size:0.7rem;"></span></div>
      <div class="detail-row"><span class="lbl">Image ID</span><span class="val" id="d-imgid" style="font-size:0.7rem;"></span></div>
    </div>
  </div>

<script>
  let offset = 0;
  const LIMIT = 200;
  let total = 0;
  let mode = 'raw';   // 'raw' | 'clean'
  let selectedId = null;

  function imgUrl(id) {
    return mode === 'clean' ? `/opensar-image-clean/${id}` : `/opensar-image/${id}`;
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btn-raw').style.background   = m === 'raw'   ? '#2563eb' : '#1a1d27';
    document.getElementById('btn-raw').style.color        = m === 'raw'   ? '#fff'    : '#ccc';
    document.getElementById('btn-raw').style.borderColor  = m === 'raw'   ? '#2563eb' : '#2a2d3a';
    document.getElementById('btn-clean').style.background = m === 'clean' ? '#2563eb' : '#1a1d27';
    document.getElementById('btn-clean').style.color      = m === 'clean' ? '#fff'    : '#ccc';
    document.getElementById('btn-clean').style.borderColor= m === 'clean' ? '#2563eb' : '#2a2d3a';
    // Refresh all visible chip images
    document.querySelectorAll('.chip img').forEach(img => {
      const id = img.closest('.chip').dataset.id;
      img.src = imgUrl(id) + '?t=' + Date.now();
    });
    // Refresh detail panel if open
    if (selectedId) {
      document.getElementById('detail-img').src = imgUrl(selectedId) + '?t=' + Date.now();
    }
  }

  function filters() {
    return {
      ship_type:    document.getElementById('f-type').value,
      polarization: document.getElementById('f-pol').value,
    };
  }

  async function loadImages(reset=true) {
    if (reset) { offset = 0; document.getElementById('grid').innerHTML = ''; }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('empty').style.display   = 'none';

    const f = filters();
    const params = new URLSearchParams({ ...f, limit: LIMIT, offset });
    const res  = await fetch('/api/opensar/images?' + params);
    const data = await res.json();

    document.getElementById('loading').style.display = 'none';
    total = data.total;
    document.getElementById('count-label').textContent = `${total.toLocaleString()} images`;
    document.getElementById('toolbar-info').textContent =
      `Showing ${offset + data.images.length} of ${total.toLocaleString()}`;

    if (data.images.length === 0 && reset) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    const grid = document.getElementById('grid');
    data.images.forEach(img => {
      const div = document.createElement('div');
      div.className = 'chip';
      div.dataset.id = img.id;
      div.innerHTML = `
        <img src="${imgUrl(img.id)}" loading="lazy" alt="${img.ship_type || ''}">
        <div class="chip-label">
          <strong>${img.ship_type || 'Unknown'}</strong>
          <span class="pol">${img.polarization || ''}</span>
          ${img.ship_length_m ? '<span style="color:#888;font-size:0.68rem;">' + Math.round(img.ship_length_m) + 'm</span>' : ''}
        </div>`;
      div.onclick = () => showDetail(img.id, div);
      grid.appendChild(div);
    });
    offset += data.images.length;
  }

  function loadMore() { loadImages(false); }

  async function showDetail(id, el) {
    document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedId = id;

    const res  = await fetch(`/api/opensar/image/${id}`);
    const d    = await res.json();
    const panel = document.getElementById('detail-panel');
    panel.classList.add('open');

    document.getElementById('detail-img').src = imgUrl(id) + '?t=' + Date.now();

    const t = d.ship_type || '';
    document.getElementById('detail-type-badge').innerHTML =
      `<span class="type-badge ${t}">${t || 'Unknown type'}</span>`;

    document.getElementById('d-type').textContent   = d.ship_type || '—';
    document.getElementById('d-ais').textContent    = d.ship_type_ais || '—';
    document.getElementById('d-length').textContent = d.ship_length_m ? Math.round(d.ship_length_m) + ' m' : '—';
    document.getElementById('d-width').textContent  = d.ship_width_m  ? Math.round(d.ship_width_m)  + ' m' : '—';
    document.getElementById('d-pol').textContent    = d.polarization || '—';
    document.getElementById('d-scene').textContent  = d.scene_id || '—';
    document.getElementById('d-imgid').textContent  = d.image_id || '—';
  }

  loadImages();
</script>
</body>
</html>
